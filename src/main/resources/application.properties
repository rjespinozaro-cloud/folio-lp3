# ===================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ===================================================================
spring.application.name=folio-lp3
server.port=8080
server.servlet.context-path=/api/v1

# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS - MARIADB
# ===================================================================
spring.datasource.url=jdbc:mariadb://localhost:3306/folio-lp3?useUnicode=true&characterEncoding=utf8mb4
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===================================================================
# CONFIGURACIÓN DE LOGGING
# ===================================================================
logging.level.root=INFO
logging.level.folio_lp3=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===================================================================
# CONFIGURACIÓN DE VALIDACIÓN
# ===================================================================
spring.validation.enabled=true

# ===================================================================
# CONFIGURACIÓN DE SEGURIDAD
# ===================================================================
spring.security.user.name=admin
spring.security.user.password=admin123
jwt.secret=folio_lp3_secret_key_2026_cybersecurity_platform
jwt.expiration=86400000

# ===================================================================
# CONFIGURACIÓN DE SESIÓN
# ===================================================================
spring.session.store-type=none
server.servlet.session.timeout=30m

# ===================================================================
# CONFIGURACIÓN DE ERRORES
# ===================================================================
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-binding-errors=always

# ===================================================================
# CONFIGURACIÓN DE JACKSON
# ===================================================================
spring.jackson.default-property-inclusion=non_null
#spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.time-zone=America/Bogota

# ===================================================================
# CONFIGURACIÓN DE SCHEDULER
# ===================================================================
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=folio-scheduler-
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.thread-name-prefix=folio-executor-
